# -----------------------------------------------------------------------------
# PRUEFREGELN
# -----------------------------------------------------------------------------

regeln:

  # --- Art. 5 Abs. 1: verbotene Praktiken -----------------------------------

  - id: V-01
    frage: >-
      Wird das System eingesetzt, um Emotionen von Personen am Arbeitsplatz
      oder in Bildungseinrichtungen abzuleiten?
    trifft_zu_wenn: emotionserkennung_arbeit_bildung
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 lit. f KI-VO"
    ausnahmen: >-
      Gilt nicht, wenn die Verwendung des KI-Systems aus medizinischen Gruenden
      oder Sicherheitsgruenden eingefuehrt oder auf den Markt gebracht werden soll.
    anmerkung: >-
      Der Normtext nennt Arbeitsplatz UND Bildungseinrichtungen als Aufzaehlung.
      Die Pruefrage verknuepft sie mit ODER, weil jeder Kontext fuer sich den
      Tatbestand erfuellt.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-02
    frage: >-
      Werden natuerliche Personen individuell anhand ihrer biometrischen Daten
      kategorisiert, um daraus Rasse, politische Einstellungen,
      Gewerkschaftszugehoerigkeit, religioese oder weltanschauliche
      Ueberzeugungen, das Sexualleben oder die sexuelle Ausrichtung zu
      erschliessen oder abzuleiten?
    trifft_zu_wenn: biometrische_kategorisierung_sensibel
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 lit. g KI-VO"
    ausnahmen: >-
      Gilt nicht fuer die Kennzeichnung oder Filterung rechtmaessig erworbener
      biometrischer Datensaetze, etwa Bilder auf der Grundlage biometrischer
      Daten, oder fuer die Kategorisierung biometrischer Daten im Bereich der
      Strafverfolgung.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-03
    frage: >-
      Werden Personen ueber einen Zeitraum anhand ihres sozialen Verhaltens oder
      persoenlicher Eigenschaften bewertet, und fuehrt diese Bewertung zu
      Benachteiligung in unzusammenhaengenden Kontexten oder zu
      unverhaeltnismaessiger Schlechterstellung?
    trifft_zu_wenn: social_scoring
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 lit. c KI-VO"
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-04
    frage: >-
      Werden Gesichtsbilder ungezielt aus dem Internet oder aus
      Ueberwachungsaufnahmen ausgelesen, um Gesichtserkennungsdatenbanken zu
      erstellen oder zu erweitern?
    trifft_zu_wenn: gesichtsbilder_scraping
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 lit. e KI-VO"
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-05
    frage: >-
      Setzt das System Techniken der unterschwelligen Beeinflussung ausserhalb
      des Bewusstseins einer Person oder absichtlich manipulative oder
      taeuschende Techniken ein, die das Verhalten wesentlich veraendern, indem
      sie die Faehigkeit zu einer fundierten Entscheidung deutlich
      beeintraechtigen - sodass die Person eine Entscheidung trifft, die sie
      andernfalls nicht getroffen haette, und ihr oder anderen dadurch
      erheblicher Schaden zugefuegt wird oder mit hinreichender
      Wahrscheinlichkeit zugefuegt werden wird?
    trifft_zu_wenn: manipulative_techniken
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 lit. a KI-VO"
    hinweis: >-
      Die Beeintraechtigung der freien Entscheidung ist Teil des Tatbestands.
      Uebliche und rechtmaessige Geschaeftspraktiken wie Werbung fallen nicht
      darunter, nur weil sie Verhalten beeinflussen (Erwaegungsgrund 29).
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-06
    frage: >-
      Nutzt das System eine Vulnerabilitaet oder Schutzbeduerftigkeit aufgrund
      von Alter, Behinderung oder einer bestimmten sozialen oder
      wirtschaftlichen Situation aus - mit dem Ziel oder der Wirkung, Verhalten
      wesentlich zu veraendern und dadurch erheblichen Schaden zuzufuegen oder
      mit hinreichender Wahrscheinlichkeit zuzufuegen?
    trifft_zu_wenn: ausnutzung_vulnerabilitaet
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 lit. b KI-VO"
    hinweis: >-
      Es genuegt die Wirkung; eine Absicht muss nicht nachgewiesen werden.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-07
    frage: >-
      Setzen Sie ein KI-System gezielt dafuer ein, realistische Bild-, Video-,
      Ton- oder aehnliche Inhalte zu erzeugen oder zu manipulieren, in denen
      intime Koerperteile einer bestimmbaren natuerlichen Person dargestellt
      werden oder eine an eindeutig sexuellen Handlungen beteiligte
      bestimmbare Person dargestellt wird - ohne dass die betreffende Person
      dazu eine aus freien Stuecken erfolgende, spezifische, aufgeklaerte,
      eindeutige und ausdrueckliche Zustimmung erteilt hat?
    trifft_zu_wenn: intimdarstellung_ohne_zustimmung
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 Unterabsatz 1 lit. ba KI-VO"
    frist_ref: F-07
    ausnahmen: >-
      Nicht erfasst ist eine Manipulation, die weder die Sichtbarkeit der
      dargestellten intimen Koerperteile erhoeht noch die Art der
      dargestellten eindeutig sexuellen Handlungen veraendert
      (Art. 5 Abs. 1b KI-VO).
    anmerkung: >-
      Die Prueffrage ist auf die Betreiberperspektive zugeschnitten. Nach
      Art. 5 Abs. 1a lit. b ist die VERWENDUNG nur verboten, wenn der
      Betreiber das System zum Zwecke einer solchen Erzeugung oder
      Manipulation einsetzt. Der blosse Einsatz eines generativen Systems,
      das solche Inhalte technisch erzeugen koennte, loest das Verbot fuer
      Betreiber nicht aus. Anbieter benoetigen eine gesonderte Pruefung nach
      Art. 5 Abs. 1a lit. a (Zweckbestimmung oder fehlende zumutbare
      Schutzvorkehrungen); diese ist hier nicht abgebildet.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: V-08
    frage: >-
      Setzen Sie ein KI-System gezielt dafuer ein, Material oder Darbietungen
      im Sinne von Artikel 2 Buchstaben c und e der Richtlinie 2011/93/EU zu
      erzeugen oder zu manipulieren?
    trifft_zu_wenn: darstellung_sexueller_kindesmissbrauch
    klasse: verboten
    fundstelle: "Art. 5 Abs. 1 Unterabsatz 1 lit. bb KI-VO"
    frist_ref: F-07
    ausnahmen: >-
      Gilt nicht, soweit das unrechtmaessige Verhalten nach nationalem Recht
      als gerechtfertigt gilt.
    anmerkung: >-
      Der Normtext verweist auf die Richtlinie 2011/93/EU, statt den
      Tatbestand auszuformulieren; die Prueffrage gibt den Verweis wieder.
      Fuer die Betreiberperspektive gilt dieselbe Eingrenzung wie bei V-07
      (Art. 5 Abs. 1a lit. b): verboten ist die zweckgerichtete Verwendung.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  # NICHT ABGEBILDET aus Art. 5 Abs. 1:
  #   lit. d  Risikobewertung, ob eine natuerliche Person eine Straftat begeht,
  #           allein auf Grundlage von Profiling
  #   lit. h  Biometrische Echtzeit-Fernidentifizierung in oeffentlich
  #           zugaenglichen Raeumen zu Strafverfolgungszwecken
  # Beide richten sich an Strafverfolgungsbehoerden. Fuer die Zielgruppe dieses
  # Werkzeugs - Unternehmen ohne hoheitliche Aufgaben - sind sie praktisch nie
  # einschlaegig. Die Auslassung ist eine bewusste Entscheidung, keine Luecke.
  # Wer Kataster in einem behoerdlichen Umfeld einsetzt, muss beide ergaenzen.

  # NICHT ABGEBILDET aus Anhang III:
  #   Nr. 6      Strafverfolgung (lit. a bis e)
  #   Nr. 7      Migration, Asyl und Grenzkontrolle (lit. a bis d)
  # Beide setzen ein Handeln von Strafverfolgungs-, Grenzschutz-, Einwanderungs-
  # oder Asylbehoerden voraus. Dieselbe Begruendung wie bei Art. 5 lit. d und h.
  # Anhang III Nr. 8 lit. b ist dagegen abgebildet (H-13), weil er nicht auf
  # Behoerden beschraenkt ist.

  # --- Art. 6 Abs. 1: Hochrisiko ueber Anhang I -----------------------------
  # Der praktisch wichtigste Pfad fuer produzierende Unternehmen.

  - id: P-01
    frage: >-
      Ist das KI-System selbst ein Produkt, das unter die
      Harmonisierungsrechtsvorschriften aus Anhang I faellt (u. a. Maschinen,
      Spielzeug, Sportboote, Aufzuege, Geraete fuer explosionsgefaehrdete
      Bereiche, Funkanlagen, Druckgeraete, Seilbahnen, persoenliche
      Schutzausruestung, Gasverbrauchseinrichtungen, Medizinprodukte,
      In-vitro-Diagnostika, Fahrzeuge, Schiffsausruestung, Eisenbahn,
      Luftfahrzeuge)?
    trifft_zu_wenn: anhang_i_produkt
    zusatzbedingung:
      frage: >-
        Muss dieses Produkt nach den genannten Vorschriften einer
        Konformitaetsbewertung durch eine dritte Stelle unterzogen werden, die
        sich nicht ausschliesslich aus anderen Risiken als Risiken fuer
        Gesundheit und Sicherheit ergibt (etwa Funkfrequenzen oder
        elektromagnetische Interferenzen)?
      trifft_zu_wenn: anhang_i_dritte_konformitaetsbewertung
    klasse: hochrisiko
    fundstelle: "Art. 6 Abs. 1 KI-VO i. V. m. Anhang I"
    frist_ref: F-06
    hinweis: >-
      Beide Bedingungen muessen kumulativ erfuellt sein. Der Ausnahmefilter des
      Art. 6 Abs. 3 gilt fuer diesen Pfad NICHT - er bezieht sich nur auf
      Anhang III. Die Einschraenkung in der Zusatzfrage folgt aus Art. 6
      Abs. 1c, der an Art. 6 Abs. 1 lit. b anknuepft und damit beide
      Alternativen aus lit. a erfasst.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: P-02
    frage: >-
      Ist das KI-System ein Bestandteil eines Produkts, das unter die
      Harmonisierungsrechtsvorschriften aus Anhang I faellt (u. a. Maschinen,
      Spielzeug, Aufzuege, Funkanlagen, Druckgeraete, Seilbahnen,
      Medizinprodukte, Fahrzeuge, Luftfahrzeuge), und besteht seine
      Zweckbestimmung darin, Risiken fuer die
      Gesundheit und Sicherheit von
      Personen oder Eigentum abzuwenden oder zu mindern - oder wuerde sein
      Ausfall oder seine Stoerung Gesundheit, Sicherheit oder Eigentum
      gefaehrden?
    trifft_zu_wenn: anhang_i_sicherheitsbauteil
    zusatzbedingung:
      frage: >-
        Muss dieses Produkt nach den genannten Vorschriften einer
        Konformitaetsbewertung durch eine dritte Stelle unterzogen werden, die
        sich nicht ausschliesslich aus anderen Risiken als Risiken fuer
        Gesundheit und Sicherheit ergibt (etwa Funkfrequenzen oder
        elektromagnetische Interferenzen)?
      trifft_zu_wenn: anhang_i_dritte_konformitaetsbewertung
    klasse: hochrisiko
    fundstelle: >-
      Art. 6 Abs. 1 KI-VO i. V. m. Art. 3 Nr. 14 und Art. 6 Abs. 1a bis 1c
    frist_ref: F-06
    ausnahmen: >-
      Nach Art. 6 Abs. 1a gelten KI-Systeme nicht als Sicherheitsbauteil, die
      ausschliesslich fuer nicht sicherheitsrelevante Aspekte der
      Nutzerunterstuetzung, Leistungsoptimierung, Leistungseffizienz,
      Automatisierung, Benutzerfreundlichkeit oder Qualitaetskontrolle
      verwendet werden. Unbeschadet dessen gilt nach Art. 6 Abs. 1b ein System
      als Sicherheitsbauteil, wenn sein Ausfall oder seine Fehlfunktion
      Gesundheit und Sicherheit gefaehrden wuerde.
    anmerkung: >-
      Erwaegungsgrund 7: die Zweckbestimmung wird vom Anbieter festgelegt. Die
      blosse Tatsache, dass ein KI-System in ein Produkt integriert ist oder in
      einem Produkt zum Einsatz kommt, das Harmonisierungsrechtsvorschriften
      unterliegt, begruendet fuer sich noch keine Sicherheitsfunktion.
    hinweis: >-
      Nach Art. 43 Abs. 3 Unterabs. 3 sind Hersteller nicht schon deshalb zu
      einer Konformitaetsbewertung durch Dritte verpflichtet, weil das Produkt
      ein Hochrisiko-KI-System als Sicherheitsbauteil enthaelt.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  # --- Anhang III Nr. 1: Biometrie (soweit nicht verboten) ------------------

  - id: H-07
    frage: >-
      Dient das System der biometrischen Fernidentifizierung von Personen?
    trifft_zu_wenn: biometrische_fernidentifizierung
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 1 lit. a KI-VO"
    frist_ref: F-05
    ausnahmen: >-
      Nicht erfasst sind Systeme zur biometrischen Verifizierung, deren einziger
      Zweck darin besteht, zu bestaetigen, dass eine bestimmte natuerliche
      Person die ist, fuer die sie sich ausgibt.
    anmerkung: >-
      Beispiele aus Art. 3 Nr. 35 und Erwaegungsgrund 15, nicht aus dem
      Anhangstext: Entsperren eines Geraets, Zugang zu einem Dienst,
      Sicherheitszugang zu Raeumlichkeiten. Der Einleitungssatz zu Nr. 1
      stellt ausserdem darauf ab, dass der Einsatz nach Unionsrecht oder
      nationalem Recht ueberhaupt zugelassen ist.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-08
    frage: >-
      Dient das System der biometrischen Kategorisierung nach sensiblen oder
      geschuetzten Attributen oder Merkmalen auf der Grundlage von
      Rueckschluessen auf diese Attribute oder Merkmale?
    trifft_zu_wenn: biometrische_kategorisierung_hochrisiko
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 1 lit. b KI-VO"
    frist_ref: F-05
    hinweis: >-
      Greift nur, soweit die Kategorisierung nicht bereits nach Art. 5 Abs. 1
      lit. g verboten ist. Diese Abgrenzung folgt aus der Systematik, nicht aus
      dem Anhangstext.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-09
    frage: >-
      Dient das System der Emotionserkennung ausserhalb von Arbeitsplatz und
      Bildungseinrichtungen, etwa im Kundenkontakt?
    trifft_zu_wenn: emotionserkennung_sonstige
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 1 lit. c KI-VO"
    frist_ref: F-05
    hinweis: >-
      Loest zusaetzlich die Transparenzpflicht T-04 nach Art. 50 Abs. 3 aus.
    anmerkung: >-
      Der Anhangstext nennt Emotionserkennung ohne Einschraenkung. Die
      Eingrenzung auf Faelle ausserhalb von Arbeitsplatz und Bildung folgt
      daraus, dass dort bereits das Verbot nach Art. 5 Abs. 1 lit. f greift.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  # --- Anhang III Nr. 2 bis 5: uebrige Hochrisikobereiche -------------------

  - id: H-06
    frage: >-
      Wird das System als Sicherheitsbauteil im Rahmen der Verwaltung oder des
      Betriebs kritischer digitaler Infrastruktur, des Strassenverkehrs oder der
      Wasser-, Gas-, Waerme- oder Stromversorgung eingesetzt?
    trifft_zu_wenn: kritische_infrastruktur
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 2 KI-VO"
    frist_ref: F-05
    anmerkung: >-
      Der Normtext nennt Verwaltung UND Betrieb als Aufzaehlung. Die Pruefrage
      verknuepft sie mit ODER, weil jede Taetigkeit fuer sich genuegt.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-05
    frage: >-
      Steuert das System den Zugang, die Zulassung oder die Zuweisung von
      Personen zu Bildungseinrichtungen, bewertet es Lernergebnisse, bewertet
      es das angemessene Bildungsniveau einer Person oder ueberwacht es
      verbotenes Verhalten bei Pruefungen?
    trifft_zu_wenn: bildung_bewertung
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 3 lit. a bis d KI-VO"
    frist_ref: F-05
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-01
    frage: >-
      Wird das System fuer die Einstellung oder Auswahl von Personen eingesetzt,
      insbesondere um gezielte Stellenanzeigen zu schalten, Bewerbungen zu
      sichten oder zu filtern oder Bewerber zu bewerten?
    trifft_zu_wenn: personalauswahl
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 4 lit. a KI-VO"
    frist_ref: F-05
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-02
    frage: >-
      Wird das System fuer Entscheidungen eingesetzt, die die Bedingungen von
      Arbeitsverhaeltnissen, Befoerderungen oder Kuendigungen beeinflussen -
      oder fuer die Zuweisung von Aufgaben anhand individuellen Verhaltens oder
      persoenlicher Merkmale und Eigenschaften, oder fuer die Beobachtung und
      Bewertung von Leistung und Verhalten Beschaeftigter?
    trifft_zu_wenn: leistungsbewertung
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 4 lit. b KI-VO"
    frist_ref: F-05
    hinweis: >-
      Der Normtext erfasst Entscheidungen, die die genannten Bedingungen
      BEEINFLUSSEN. Ein System, das eine Entscheidung nur vorbereitet oder
      mitpraegt, ist damit erfasst - nicht erst eines, das sie trifft.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-10
    frage: >-
      Wird das System von einer Behoerde oder in deren Namen verwendet, um ueber
      Anspruch, Gewaehrung, Einschraenkung, Widerruf oder Rueckforderung
      grundlegender oeffentlicher Unterstuetzungsleistungen und -dienste zu
      entscheiden - einschliesslich Gesundheitsdiensten?
    trifft_zu_wenn: oeffentliche_leistungen
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 5 lit. a KI-VO"
    frist_ref: F-05
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-03
    frage: >-
      Dient das System der Kreditwuerdigkeitspruefung oder Bonitaetsbewertung
      natuerlicher Personen?
    trifft_zu_wenn: kreditwuerdigkeit
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 5 lit. b KI-VO"
    frist_ref: F-05
    ausnahmen: "Systeme zur Aufdeckung von Finanzbetrug sind ausgenommen."
    loest_aus: [Q-04]
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-04
    frage: >-
      Dient das System der Risikobewertung oder Preisbildung in Bezug auf
      natuerliche Personen bei Lebens- oder Krankenversicherungen?
    trifft_zu_wenn: versicherung_risikobewertung
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 5 lit. c KI-VO"
    frist_ref: F-05
    loest_aus: [Q-04]
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-11
    frage: >-
      Dient das System der Bewertung und Klassifizierung von Notrufen, der
      Entsendung oder Priorisierung von Not- und Rettungsdiensten oder der Triage
      von Patienten in der Notfallversorgung?
    trifft_zu_wenn: notruf_triage
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 5 lit. d KI-VO"
    frist_ref: F-05
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-12
    frage: >-
      Wird das System von einer Justizbehoerde oder in deren Namen verwendet,
      um bei der Ermittlung und Auslegung von Sachverhalten und
      Rechtsvorschriften oder bei der Anwendung des Rechts auf konkrete
      Sachverhalte zu unterstuetzen - oder auf aehnliche Weise fuer die
      alternative Streitbeilegung?
    trifft_zu_wenn: rechtspflege_streitbeilegung
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 8 lit. a KI-VO"
    frist_ref: F-05
    hinweis: >-
      Die Eingrenzung auf Justizbehoerden ist Teil des Tatbestands. Ein
      Unternehmen, das intern Rechtsfragen mit KI prueft, ist nicht erfasst.
      Reine Verwaltungstaetigkeiten wie Anonymisierung sind ebenfalls nicht
      erfasst (Erwaegungsgrund 61).
    anmerkung: >-
      Erwaegungsgrund 61 nennt fuer die alternative Streitbeilegung zusaetzlich
      das Merkmal, dass die Ergebnisse Rechtswirkung fuer die Parteien
      entfalten. Im Anhangstext steht dieses Merkmal nicht.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: H-13
    frage: >-
      Wird das System eingesetzt, um das Ergebnis einer Wahl oder eines
      Referendums oder das Wahlverhalten von Personen bei der Ausuebung ihres
      Wahlrechts zu beeinflussen?
    trifft_zu_wenn: wahlbeeinflussung
    klasse: hochrisiko
    fundstelle: "Anhang III Nr. 8 lit. b KI-VO"
    frist_ref: F-05
    ausnahmen: >-
      Nicht erfasst sind Systeme, deren Ausgaben natuerliche Personen nicht
      direkt ausgesetzt sind - etwa Werkzeuge zur Organisation, Optimierung
      oder Strukturierung politischer Kampagnen in administrativer oder
      logistischer Hinsicht.
    hinweis: >-
      Anders als Nr. 6 und Nr. 7 ist diese Nummer nicht auf Behoerden
      beschraenkt. Sie kann Kommunikationsagenturen, Verbaende und Unternehmen
      treffen, die politische Kampagnen begleiten.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  # --- Art. 50: Transparenzpflichten ----------------------------------------
  # Rolle beachten: Abs. 1 und 2 sind Anbieterpflichten, Abs. 3 und 4
  # Betreiberpflichten.

  - id: T-01
    frage: >-
      Ist das System fuer die direkte Interaktion mit natuerlichen Personen
      bestimmt, etwa als Chatbot?
    trifft_zu_wenn: direkte_interaktion
    nur_bei_rolle: [anbieter]
    klasse: transparenz
    fundstelle: "Art. 50 Abs. 1 KI-VO"
