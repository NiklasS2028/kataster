    trifft_zu_wenn: emotionserkennung_sonstige
    nur_bei_rolle: [betreiber, anbieter]
    klasse: transparenz
    fundstelle: "Art. 50 Abs. 3 KI-VO"
    massnahme: >-
      Die betroffenen Personen sind ueber den Betrieb des Systems zu informieren.
      Personenbezogene Daten sind nach DSGVO zu verarbeiten.
    frist_ref: F-04
    hinweis: "BETREIBERPFLICHT."
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: T-02
    frage: >-
      Erzeugen oder manipulieren Sie mit dem System Bild-, Ton- oder
      Videoinhalte, die wirklichen Personen, Orten oder Ereignissen aehneln und
      faelschlicherweise echt erscheinen wuerden (Deepfake)?
    trifft_zu_wenn: deepfake
    nur_bei_rolle: [betreiber, anbieter]
    klasse: transparenz
    fundstelle: "Art. 50 Abs. 4 Unterabs. 1 KI-VO"
    massnahme: "Offenlegung, dass die Inhalte kuenstlich erzeugt oder manipuliert wurden."
    anmerkung: >-
      Die Begriffsbestimmung des Deepfake steht nicht in Art. 50, sondern in
      Art. 3 Nr. 60."
    ausnahmen: >-
      Bei offensichtlich kuenstlerischen, kreativen, satirischen oder fiktionalen
      Werken beschraenkt sich die Pflicht auf eine geeignete Offenlegung, die
      die Darstellung oder den Genuss des Werks nicht beeintraechtigt.
    frist_ref: F-04
    hinweis: "BETREIBERPFLICHT."
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: T-03
    frage: >-
      Veroeffentlichen Sie KI-erzeugte oder KI-manipulierte Texte, um die
      Oeffentlichkeit ueber Angelegenheiten von oeffentlichem Interesse zu
      informieren?
    trifft_zu_wenn: ki_texte_oeffentlich
    nur_bei_rolle: [betreiber, anbieter]
    klasse: transparenz
    fundstelle: "Art. 50 Abs. 4 Unterabs. 2 KI-VO"
    ausnahmen: >-
      Entfaellt, wenn die Inhalte einer menschlichen Ueberpruefung oder
      redaktionellen Kontrolle unterzogen wurden und eine natuerliche oder
      juristische Person die redaktionelle Verantwortung traegt.
    frist_ref: F-04
    hinweis: "BETREIBERPFLICHT."
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

# -----------------------------------------------------------------------------
# AUSNAHMEFILTER NACH ART. 6 ABS. 3
# -----------------------------------------------------------------------------
# Ein in Anhang III gelistetes System ist ausnahmsweise NICHT hochriskant, wenn
# es kein erhebliches Risiko birgt und eine der vier Bedingungen erfuellt.
# Diese Bewertung ist zu dokumentieren (Art. 6 Abs. 4) - genau das ist ein
# Kernanwendungsfall des Nachweis-Dossiers.
#
# WICHTIG: Der Filter greift NIE, wenn das System Profiling natuerlicher
# Personen vornimmt. Er gilt ausserdem nur fuer Anhang III, nicht fuer P-01.
# -----------------------------------------------------------------------------

ausnahmefilter_anhang_iii:
  fundstelle: "Art. 6 Abs. 3 und 4 KI-VO"
  gilt_nicht_bei: profiling
  sperrhinweis: >-
    Nimmt das System Profiling im Sinne von Art. 4 Nr. 4 DSGVO vor, bleibt es
    in jedem Fall hochriskant. Der Filter darf dann nicht angewendet werden.
  bedingungen:
    - id: E-01
      text: "Das System fuehrt eine eng gefasste Verfahrensaufgabe durch."
      fundstelle: "Art. 6 Abs. 3 lit. a KI-VO"
    - id: E-02
      text: "Das System verbessert das Ergebnis einer zuvor abgeschlossenen menschlichen Taetigkeit."
      fundstelle: "Art. 6 Abs. 3 lit. b KI-VO"
    - id: E-03
      text: >-
        Das System erkennt Entscheidungsmuster oder Abweichungen davon und soll
        eine zuvor abgeschlossene menschliche Bewertung nicht ohne angemessene
        menschliche Ueberpruefung ersetzen oder beeinflussen.
      fundstelle: "Art. 6 Abs. 3 lit. c KI-VO"
    - id: E-04
      text: "Das System fuehrt eine vorbereitende Aufgabe fuer eine Bewertung durch."
      fundstelle: "Art. 6 Abs. 3 lit. d KI-VO"
  folgepflichten:
    - "Die Bewertung ist vor Inverkehrbringen oder Inbetriebnahme zu dokumentieren."
    - "Registrierungspflicht in der EU-Datenbank nach Art. 49 Abs. 2."
    - "Vorlage der Bewertungsdokumentation auf Verlangen der zustaendigen Behoerde."
  hinweis_kataster: >-
    Kataster wendet diesen Filter NICHT automatisch an. Er wird als
    dokumentierte Entscheidung des Nutzers erfasst, mit Begruendungsfeld, und
    im Dossier als solche ausgewiesen.
  geprueft: false

# -----------------------------------------------------------------------------
# QUERSCHNITTSPFLICHTEN
# -----------------------------------------------------------------------------

querschnittspflichten:

  - id: Q-01
    gegenstand: "KI-Kompetenz der Beschaeftigten"
    fundstelle: "Art. 4 KI-VO"
    gilt_seit: "2025-02-02"
    gilt_fuer: [anbieter, betreiber]
    lesart_original: >-
      Anbieter und Betreiber ergreifen Massnahmen, um nach besten Kraeften
      sicherzustellen, dass ihr Personal und andere Personen, die in ihrem
      Auftrag mit Betrieb und Nutzung von KI-Systemen befasst sind, ueber ein
      ausreichendes Mass an KI-Kompetenz verfuegen. Zu beruecksichtigen sind
      technische Kenntnisse, Erfahrung, Ausbildung und Schulung sowie der
      Einsatzkontext und die betroffenen Personengruppen.
    lesart_omnibus: >-
      Art. 4 wird durch Art. 1 Nr. 5 der VO (EU) 2026/1744 neu gefasst. Die
      Pflicht, Massnahmen zu ergreifen, bestand bereits; schon die
      Ausgangsfassung verlangte, dass Anbieter und Betreiber Massnahmen
      ergreifen. Geaendert hat sich das Ziel dieser Massnahmen: An die Stelle
      des angestrebten Zustands, nach besten Kraeften sicherzustellen, dass die
      betroffenen Personen ueber ein ausreichendes Mass an KI-Kompetenz
      verfuegen, tritt die Unterstuetzung der Entwicklung dieser Kompetenz. Zu
      beruecksichtigen sind weiterhin technische Kenntnisse, Erfahrung, Aus- und
      Fortbildung, Einsatzkontext und die betroffenen Personengruppen. Abs. 1
      Satz 2 stellt ausdruecklich klar, dass fuer keine Person ein bestimmtes
      Niveau an KI-Kompetenz garantiert werden muss. Abs. 2 und 3 richten sich
      an Kommission, Mitgliedstaaten und KI-Gremium und begruenden keine
      Unternehmenspflicht.
    hinweis_praxis: >-
      Unabhaengig von der Lesart bleiben andere Rechtsgruende unberuehrt:
      DSGVO Art. 32, Sorgfaltspflicht der Geschaeftsleitung, Produkthaftung.
      Art. 4 enthaelt keine eigene Bussgeldnorm. Zur Erfuellung veroeffentlicht
      die Kommission praktische Beispiele auf der zentralen Informationsplattform
      (Art. 4 Abs. 2 i. V. m. Art. 62 Abs. 3 lit. b), das KI-Gremium gibt
      Empfehlungen (Art. 4 Abs. 3). Erwaegungsgrund 8 stuetzt die Lesart: Er
      beschreibt den Uebergang von der Pflicht, die KI-Kompetenz des Personals
      sicherzustellen, zur Pflicht, Massnahmen zu ihrer Foerderung zu ergreifen,
      und begruendet ihn mit dem Befolgungsaufwand gerade fuer kleinere
      Unternehmen. Diese Wiedergabe folgt dem Wortlaut von EG 8, der den
      Uebergang verkuerzt darstellt: Er verkuerzt schon den alten Rechtsstand,
      der bereits Massnahmen verlangte, und spricht von Foerderung, wo der
      verfuegende Text die Entwicklung der KI-Kompetenz unterstuetzen laesst. Im
      Zweifel ist der verfuegende Text von Art. 4 massgeblich, nicht die
      verkuerzte Beschreibung des Erwaegungsgrundes.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: Q-02
    gegenstand: "Bussgeldrahmen: Hoechstbetraege nach Art. 99 Abs. 3 bis 5"
    fundstelle: "Art. 99 KI-VO"
    # Zuschnitt des Eintrags: Q-02 bildet Art. 99 nicht vollstaendig ab. stufen
    # deckt Abs. 3, 4 und 5 (Hoechstbetraege), Abs. 1 (Beruecksichtigung bei der
    # Bemessung) laeuft ueber G-05, Abs. 6 und Abs. 6a (Deckelung) ueber die
    # Zeiger G-06/G-07 auf kmu_regel/midcap_regel. Der gegenstand nennt daher
    # ausdruecklich nur die Hoechstbetraege nach Abs. 3 bis 5, damit der Kopf
    # keine Vollstaendigkeitserwartung weckt, die der Eintrag nicht einloest.
    # - Abs. 2 ist bewusst nicht abgebildet: reine Mitteilungspflicht der
    #   Mitgliedstaaten gegenueber der Kommission ueber die Sanktionsregeln
    #   ("The Member States shall notify the Commission ...", Service Desk
    #   2026-07-31). Kein Unternehmensadressat, fuer die Zielgruppe des Werkzeugs
    #   ohne Belang, die Auslassung ist sachlich richtig.
    # - Abs. 7 (Bemessungskriterien im Einzelfall) ist VORGEMERKT als eigener
    #   Punkt, nicht Teil dieses Zugs. Die Kriterien wirken im Einzelfall immer,
    #   waehrend Hoechstbetraege selten ausgeschoepft werden, und sind fuer ein
    #   Unternehmen praktisch relevanter. Aufnahme braucht eigenes Nachlesen und
    #   eigene Entscheidung, daher hier nur der Merker.
    # Zwei Pruefstandsebenen:
    # - Der entry-level 'geprueft' unten deckt gegenstand, fundstelle und stufen.
    # - kmu_regel und midcap_regel tragen je einen EIGENEN Schalter nach der
    #   Konvention '<feld>_geprueft', weil sie als Zeigerziele von G-06/G-07
    #   unabhaengig vom uebrigen Q-02 ins Dossier gerendert werden und deshalb
    #   getrennt freigebbar sein muessen.
    # Wer hier ein Feld ergaenzt: Es ist vom entry-level Schalter gedeckt,
    # solange es kein Zeigerziel ist. Wird es eins, braucht es ein eigenes
    # '<feld>_geprueft', sonst faellt der Zeiger still aus der Anzeige (die
    # Validierung meldet das als Hinweis).
    stufen:
      - verstoss: "Verbotene Praktiken nach Art. 5"
        maximum: "35 Mio. EUR oder 7 % des weltweiten Jahresumsatzes (Anwendung der Obergrenze: siehe grundregel)"
        fundstelle: "Art. 99 Abs. 3"
      - verstoss: >-
          Pflichten der Anbieter (Art. 16), Bevollmaechtigten (Art. 22),
          Einfuehrer (Art. 23), Haendler (Art. 24), Betreiber (Art. 26),
          Anforderungen und Pflichten fuer notifizierte Stellen (Art. 31,
          Art. 33 Abs. 1, 3 und 4 sowie Art. 34) sowie Transparenzpflichten
          (Art. 50)
        maximum: "15 Mio. EUR oder 3 % des weltweiten Jahresumsatzes (Anwendung der Obergrenze: siehe grundregel)"
        fundstelle: "Art. 99 Abs. 4"
      - verstoss: >-
          Falsche, unvollstaendige oder irrefuehrende Angaben gegenueber
          notifizierten Stellen oder zustaendigen nationalen Behoerden auf deren
          Auskunftsersuchen
        maximum: "7,5 Mio. EUR oder 1 % des weltweiten Jahresumsatzes (Anwendung der Obergrenze: siehe grundregel)"
        fundstelle: "Art. 99 Abs. 5"
    # grundregel ist vom entry-level 'geprueft' gedeckt, KEIN eigener Schalter.
    # Nach der Konvention im Kopf braucht ein Feld nur dann ein eigenes
    # '<feld>_geprueft', wenn es Zeigerziel ist und unabhaengig vom uebrigen Q-02
    # gerendert wird. Zeigerziele sind allein kmu_regel und midcap_regel (Ziele
    # von G-06/G-07, die NIEDRIGERE Deckelung). grundregel rahmt dagegen die
    # stufen selbst, den HOEHEREN Wert, ist keine groessengebundene Erleichterung
    # und wird von keinem G-Eintrag angesteuert. Sie gehoert damit zur selben
    # Verifikationseinheit wie stufen und faellt unter den entry-level Schalter.
    # Wird sie spaeter doch Zeigerziel, meldet die Validierung das fehlende
    # 'grundregel_geprueft' als Hinweis, sie kann also nicht still ausfallen.
    grundregel: >-
      Bei allen drei Stufen nach Abs. 3, 4 und 5 gilt als Obergrenze der
      hoehere der beiden genannten Werte, also der groessere aus festem
      Euro-Betrag und dem Prozentsatz des gesamten weltweiten Jahresumsatzes des
      vorangegangenen Geschaeftsjahres; im Wortlaut: 'je nachdem, welcher Betrag
      hoeher ist'. Der Prozentsatz gilt nur im Falle von Unternehmen. Fuer
      Nicht-Unternehmen folgt daraus, dass allein der feste Betrag greift; das
      ist ein Schluss aus dem Wortlaut, nicht selbst Wortlaut.
      Diese Grundregel ist der Schluessel zur Deckelung nach Abs. 6 und Abs. 6a:
      kmu_regel und midcap_regel bestimmen als Obergrenze den jeweils
      NIEDRIGEREN Betrag, was nur vor dem Hintergrund verstaendlich ist, dass
      hier sonst der hoehere gilt.
    kmu_regel: >-
      Bei KMU einschliesslich Start-ups gilt fuer JEDE in diesem Artikel
      genannte Geldbusse als Obergrenze der jeweils niedrigere Betrag aus den in
      Abs. 3, 4 und 5 genannten Prozentsaetzen oder Summen. Zwei Dimensionen:
      erfasst sind alle Bussen des Artikels, und die Bezugsgroessen der
      Obergrenze sind die Werte aus Abs. 3, 4 und 5.
    kmu_fundstelle: "Art. 99 Abs. 6 KI-VO"
    # Freigabe der beiden Regel-Felder war bereits am 2026-07-30 erteilt (Einheit
    # 2 und 3 der Gegenueberstellung), konnte wegen des zuvor geteilten
    # Q-02-Schalters nur technisch nicht gesetzt werden. Hier nachgezogen, keine
    # neue Freigabe. Zur Aufteilung der Pruefstandsebenen siehe Kopf von Q-02.
    kmu_regel_geprueft: true
    kmu_regel_geprueft_am: "2026-07-30"
    kmu_regel_geprueft_von: "Niklas Steinhauser"
    midcap_regel: >-
      Bei kleinen Midcap-Unternehmen ist die Deckelung in BEIDEN Dimensionen
      enger als bei KMU: erfasst sind nur die Geldbussen nach Abs. 4 und Abs. 5,
      nicht die nach Abs. 3 (verbotene Praktiken), und als Bezugsgroessen dienen
      allein die darin, also in Abs. 4 und Abs. 5, genannten Betraege. Dieser
      doppelte Umfangsunterschied gegenueber der KMU-Deckelung nach Abs. 6 ist
      der Grund fuer den Split in G-06 (KMU) und G-07 (Midcap).
    midcap_fundstelle: "Art. 99 Abs. 6a KI-VO i. d. F. der VO (EU) 2026/1744"
    midcap_regel_geprueft: true
    midcap_regel_geprueft_am: "2026-07-30"
    midcap_regel_geprueft_von: "Niklas Steinhauser"
    geprueft: true
    geprueft_am: "2026-07-31"
    geprueft_von: "Niklas Steinhauser"

  - id: Q-03
    gegenstand: "Betreiberpflichten bei Hochrisiko-Systemen"
    fundstelle: "Art. 26 KI-VO"
    gilt_fuer: [betreiber]
    nur_bei_klasse: [hochrisiko]
    kernpflichten:
      - text: "Verwendung entsprechend der Betriebsanleitung, abgesichert durch technische und organisatorische Massnahmen."
        fundstelle: "Art. 26 Abs. 1"
      - text: "Menschliche Aufsicht durch Personen mit erforderlicher Kompetenz, Ausbildung und Befugnis."
        fundstelle: "Art. 26 Abs. 2"
      - text: "Sicherstellen, dass die Eingabedaten der Zweckbestimmung entsprechen und ausreichend repraesentativ sind, soweit sie der eigenen Kontrolle unterliegen."
        fundstelle: "Art. 26 Abs. 4"
      - text: "Ueberwachung des Betriebs, Meldung von Risiken und schwerwiegenden Vorfaellen an Anbieter und Marktueberwachungsbehoerde."
        fundstelle: "Art. 26 Abs. 5"
      - text: "Aufbewahrung der automatisch erzeugten Protokolle, mindestens sechs Monate."
        fundstelle: "Art. 26 Abs. 6"
      - text: >-
          ARBEITGEBER: Vor Inbetriebnahme oder Verwendung am Arbeitsplatz sind
          Arbeitnehmervertreter und betroffene Beschaeftigte darueber zu
          informieren, dass sie der Verwendung unterliegen werden.
        fundstelle: "Art. 26 Abs. 7"
        praxishinweis: "Beruehrt Mitbestimmung. Fruehzeitig mit dem Betriebsrat klaeren."
      - text: >-
          Betroffene natuerliche Personen sind zu informieren, wenn ein
          Anhang-III-Hochrisikosystem Entscheidungen ueber sie trifft oder
          solche Entscheidungen unterstuetzt.
        fundstelle: "Art. 26 Abs. 11"
    geprueft: false

  - id: Q-04
    gegenstand: "Grundrechte-Folgenabschaetzung"
    fundstelle: "Art. 27 KI-VO"
    ausgeloest_durch:
      - "Betreiber ist Einrichtung des oeffentlichen Rechts"
      - "Betreiber ist private Einrichtung, die oeffentliche Dienste erbringt"
      - "System faellt unter Anhang III Nr. 5 lit. b (Kreditwuerdigkeit)"
      - "System faellt unter Anhang III Nr. 5 lit. c (Lebens-/Krankenversicherung)"
    zeitpunkt: "vor der ersten Inbetriebnahme"
    inhalt:
      - "Beschreibung der Verfahren, in denen das System eingesetzt wird"
      - "Zeitraum und Haeufigkeit der Verwendung"
      - "Betroffene Personenkategorien und Gruppen"
      - "Spezifische Schadensrisiken fuer diese Gruppen"
      - "Umsetzung der menschlichen Aufsicht"
      - "Massnahmen bei Eintritt der Risiken, einschliesslich Beschwerdemechanismen"
    folgepflicht: >-
      Ergebnisse sind der Marktueberwachungsbehoerde mitzuteilen. Eine bereits
      durchgefuehrte Datenschutz-Folgenabschaetzung nach Art. 35 DSGVO wird
      ergaenzt, nicht ersetzt.
    ausnahme: >-
      Gilt nicht fuer Hochrisiko-Systeme aus Anhang III Nr. 2
      (kritische Infrastruktur).
    geprueft: false

  - id: Q-05
    gegenstand: "Recht betroffener Personen auf Erlaeuterung"
    fundstelle: "Art. 86 KI-VO"
    inhalt: >-
      Personen, die von einer auf einem Anhang-III-Hochrisikosystem beruhenden
      Entscheidung mit rechtlicher oder aehnlich erheblicher Wirkung betroffen
      sind, koennen vom Betreiber eine klare und aussagekraeftige Erlaeuterung
      zur Rolle des Systems im Entscheidungsprozess und zu den wichtigsten
      Elementen der Entscheidung verlangen.
    ausnahme: "Gilt nicht fuer Systeme nach Anhang III Nr. 2."
    geprueft: false

# -----------------------------------------------------------------------------
# GROESSENREGIME (KMU und kleine Midcaps)
# -----------------------------------------------------------------------------
# Erleichterungen und Schutzvorschriften, die an die Unternehmensgroesse
# anknuepfen. Anders als die uebrigen Abschnitte haengt dieses Regime nicht an
# Systemflags, sondern am Organisationsattribut groessenklasse. Es wird
# systemuebergreifend ausgewertet, siehe Regelwerk.erleichterungen_fuer.
#
# Bedingungsformen je Erleichterung:
#   gilt_fuer_groesse   Liste der Groessenklassen ODER Dict mit den Schluesseln
#                       original/omnibus (Dict-Fall), wenn sich der erfasste
#                       Kreis mit der Lesart aendert. Der Auswerter loest den
#                       Dict gegen die aktive Lesart auf.
#   gilt_in_lesart      Optional. Beschraenkt die Erleichterung auf bestimmte
#                       Lesarten, z. B. [omnibus] fuer omnibus-neue Vorschriften.
#   gilt_fuer           Rollen (Vokabular aus Q-03).
#   nur_bei_klasse      Risikoklassen (Vokabular aus Q-03).
#   setzt_kein_partner_verbund_voraus   Boolean, Negativvorbehalt.
#
# Regeltext je Erleichterung in einer von drei Formen, aufgeloest in
# Regelwerk.erleichterung_text:
#   text                flacher Text, lesartunabhaengig.
#   lesart_original /   zwei Texte, wenn sich der Inhalt mit der Lesart aendert
#   lesart_omnibus      (Dict-Fall, gleiches Muster wie in querschnittspflichten).
#   verweist_auf +      Zeiger auf ein Feld einer Querschnittspflicht statt
#   verweist_auf_feld   eigenem Text, damit sich Regeltext nicht doppelt und
#                       still auseinanderdriftet. Ein offenes Ziel wird sichtbar
#                       gemeldet, nie leer gerendert.
#
# Sonderfall: Das Feldpaar fundstelle_original/fundstelle_omnibus tritt nur in
# hinweis_verhaeltnismaessigkeit auf, einem Block ohne Lesart-Auswertung. Es ist
# kein drittes Idiom fuer die Erleichterungen.

groessenregime:
  # Definitionen sind EINE Verifikationseinheit: der Pruefstand zaehlt sie als
  # geprueft, wenn beide Eintraege es sind. Jeder Eintrag traegt sein eigenes
  # geprueft, weil er eine eigene Fundstelle hat (Nr. 14a bzw. 14b).
  definitionen:
    - klasse: kmu
      bezeichnung: "Kleinst-, kleines oder mittleres Unternehmen (KMU)"
      fundstelle: "Art. 3 Nr. 14a KI-VO i. d. F. der VO (EU) 2026/1744"
      verweist_auf: "Art. 2 des Anhangs der Empfehlung 2003/361/EG"
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"
    - klasse: kleines_midcap
      bezeichnung: "Kleines Unternehmen mit mittlerer Kapitalisierung (kleines Midcap)"
      fundstelle: "Art. 3 Nr. 14b KI-VO i. d. F. der VO (EU) 2026/1744"
      verweist_auf: "Nummer 2 des Anhangs der Empfehlung (EU) 2025/1099"
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"
  hinweis_zeitpunkt:
    text: >-
      Nach Art. 4 Abs. 2 des Anhangs der Empfehlung 2003/361/EG wechselt
      die Groessenklasse nicht sofort beim Ueber- oder Unterschreiten der
      Schwellenwerte. Der Status als Kleinst-, kleines oder mittleres Unternehmen
      wird erst gewonnen oder verloren, wenn es in zwei aufeinander folgenden
      Geschaeftsjahren zu einer Ueber- oder Unterschreitung kommt. Eine einmal
      erfasste Selbstauskunft ist deshalb nicht bei jeder Zahlenschwankung zu
      aendern. Der Begriff Schwellenwerte ist hier bewusst neutral gewaehlt:
      Art. 4 Abs. 2 nennt nur Mitarbeiterzahl und Bilanzsumme, waehrend Art. 2
      des Anhangs zusaetzlich den Umsatz als gleichrangige Alternative zur
      Bilanzsumme fuehrt. Die neutrale Fassung uebernimmt diese Ungenauigkeit der
      Empfehlung nicht und ist deshalb nicht praezisierend auf Mitarbeiterzahl
      und Bilanzsumme zu verengen.
    geprueft: true
    geprueft_am: "2026-07-30"
    geprueft_von: "Niklas Steinhauser"
  hinweis_unterstuetzung:
    text: >-
      Unabhaengig von den Erleichterungen richten sich weitere Vorschriften an
      nationale Behoerden, das Buero fuer Kuenstliche Intelligenz und die
      Kommission und begruenden keine Unternehmenspflicht, benennen aber, wo
      Unterstuetzung zu finden ist: Anleitung und Beratung durch nationale
      Behoerden (Art. 70 Abs. 8), Beruecksichtigung kleinerer Unternehmen in
      Verhaltenskodizes durch das Buero fuer Kuenstliche Intelligenz und die
      Mitgliedstaaten (Art. 95 Abs. 4) und in den Leitlinien der Kommission
      (Art. 96 Abs. 1 UAbs. 2). Alle drei Stellen wurden durch die VO (EU)
      2026/1744 (Art. 1 Nr. 29, Nr. 35 und Nr. 36 lit. c) um kleine Midcaps
      erweitert. Der Hinweis nennt bewusst keine abschliessende Groessenklasse,
      weil er nur den Fundort der Unterstuetzung benennt und keine Rechtsfolge
      traegt.
    geprueft: true
    geprueft_am: "2026-07-30"
    geprueft_von: "Niklas Steinhauser"

  # Art. 17 Abs. 2 (frueher als G-02 gefuehrt) ist keine groessengebundene
  # Erleichterung, sondern eine Verhaeltnismaessigkeitsregel fuer ALLE Anbieter
  # von Hochrisiko-Systemen. Als Erleichterung wuerde das Werkzeug sie grossen
  # Anbietern und jedem ohne erfasste Groessenklasse vorenthalten. Sie steht
  # deshalb hier als size-neutraler Hinweis, nicht in erleichterungen.
  hinweis_verhaeltnismaessigkeit:
    text: >-
      Art. 17 Abs. 2 verlangt, dass das Qualitaetsmanagementsystem im Umfang
      verhaeltnismaessig zur Groesse der Organisation des Anbieters gefuehrt
      wird. Diese Regel gilt allen Anbietern von Hochrisiko-Systemen, nicht nur
      KMU oder kleinen Midcaps. Die VO (EU) 2026/1744 nennt KMU und kleine
      Midcaps in Abs. 2 nur ausdruecklich ("insbesondere"), ohne die Regel auf
      sie zu beschraenken. Sie ist deshalb keine Erleichterung und wird nicht
      groessenabhaengig ausgespielt. Sachlicher Ort ist die Anbieterpflicht nach
      Art. 17, die bislang kein eigener Regelblock abbildet.
    fundstelle_original: "Art. 17 Abs. 2 KI-VO"
    fundstelle_omnibus: "Art. 17 Abs. 2 KI-VO i. d. F. der VO (EU) 2026/1744"
    geprueft: true
    geprueft_am: "2026-07-30"
    geprueft_von: "Niklas Steinhauser"

  erleichterungen:
    # G-02 entfaellt hier als Erleichterung. Art. 17 Abs. 2 ist size-neutral und
    # steht jetzt in groessenregime.hinweis_verhaeltnismaessigkeit. Die ID wird
    # nicht neu vergeben, damit die Luecke erklaert bleibt (Muster wie
    # anhang_i.entfallen).
    - id: G-01
      gegenstand: "Vereinfachte technische Dokumentation"
      fundstelle: "Art. 11 Abs. 1 UAbs. 2 KI-VO"
      gilt_fuer_groesse:
        original: [kmu]
        omnibus: [kmu, kleines_midcap]
      gilt_fuer: [anbieter]
      nur_bei_klasse: [hochrisiko]
      lesart_original: >-
        Art. 11 Abs. 1 UAbs. 2 erlaubt KMU einschliesslich Start-ups, die
        Elemente der technischen Dokumentation nach Anhang IV in vereinfachter
        Weise bereitzustellen. Die Kommission erstellt dafuer ein vereinfachtes
        Formular, zugeschnitten auf die Beduerfnisse kleiner Unternehmen und
        Kleinstunternehmen.
      lesart_omnibus: >-
        Art. 1 Nr. 10 der VO (EU) 2026/1744 erstreckt die Vereinfachung auf
        kleine Midcaps und aendert den Zuschnitt des Formulars. Die Moeglichkeit
        der vereinfachten Dokumentation bestand bereits im Ausgangsrecht, ebenso
        die Pflicht, bei Inanspruchnahme das Formular zu verwenden; neu sind
        allein der erweiterte Kreis und der geaenderte Formularzuschnitt.
        Fundstelle i. d. F.: Art. 11 Abs. 1 UAbs. 2 KI-VO i. d. F. der VO (EU)
        2026/1744.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

    - id: G-03
      gegenstand: "Vorrangiger Zugang zu nationalen KI-Reallaboren"
      fundstelle: "Art. 62 Abs. 1 lit. a KI-VO"
      gilt_fuer_groesse: [kmu]
      text: >-
        Die Mitgliedstaaten gewaehren KMU einschliesslich Start-ups mit Sitz
        oder Zweigniederlassung in der Union vorrangigen Zugang zu den nationalen
        KI-Reallaboren, soweit sie die Voraussetzungen und Auswahlkriterien
        erfuellen. Fuer die Zielgruppe dieses Werkzeugs meist von geringem
        praktischem Gewicht.
      hinweis: >-
        Ausgangsrecht, gilt in beiden Lesarten. Erfasst KMU, nicht kleine
        Midcaps. Art. 62 wird durch die VO (EU) 2026/1744 nicht geaendert: Art. 1
        enthaelt 43 Aenderungsbefehle, keiner betrifft Art. 62, die Reihe springt
        von Art. 60a (Nr. 25) zu Art. 63 Abs. 1 (Nr. 26). Der Omnibus-Zugang fuer
        kleine Midcaps betrifft allein das Reallabor des KI-Bueros auf Unionsebene,
        siehe G-08.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

    - id: G-04
      gegenstand: "Vereinfachtes Qualitaetsmanagement, nur ohne Partner- oder Verbundunternehmen"
      fundstelle: "Art. 63 Abs. 1 KI-VO"
      # Dict-Form trotz identischer Listen bewusst: G-04 ist ein Dict-Fall wie
      # G-01/G-05 (Scope-Aenderung Kleinstunternehmen -> alle KMU), der reale
      # Unterschied liegt unterhalb der Groessenklassen und ist im Feld nicht
      # darstellbar. Nicht zu flach [kmu] zusammenziehen, sonst geht die
      # Gleichstellung mit den uebrigen Dict-Faellen verloren.
      gilt_fuer_groesse:
        original: [kmu]
        omnibus: [kmu]
      gilt_fuer: [anbieter]
      nur_bei_klasse: [hochrisiko]
      setzt_kein_partner_verbund_voraus: true
      lesart_original: >-
        Nach Art. 63 Abs. 1 duerfen KLEINSTUNTERNEHMEN bestimmte Elemente des
        Qualitaetsmanagements nach Art. 17 in vereinfachter Weise einhalten,
        sofern sie keine Partner- oder verbundenen Unternehmen im Sinne der
        Empfehlung 2003/361/EG haben. Das Werkzeug kennt keine eigene Klasse
        Kleinstunternehmen und zeigt die Erleichterung allen KMU. Das ist
        bewusste Zuvielanzeige: kleine und mittlere Unternehmen sehen den Hinweis
        und pruefen selbst, ob sie Kleinstunternehmen sind. Eine Zuwenig-Anzeige
        waere der schwerere Fehler.
      lesart_omnibus: >-
        Art. 1 Nr. 26 der VO (EU) 2026/1744 fasst Art. 63 Abs. 1 neu und
        erstreckt die Vereinfachung von Kleinstunternehmen auf alle KMU
        einschliesslich Start-ups, weiterhin nur ohne Partner- oder verbundene
        Unternehmen. In dieser Lesart entfaellt die Zuvielanzeige, weil alle KMU
        erfasst sind. Kleine Midcaps bleiben aussen vor. Fundstelle i. d. F.:
        Art. 63 Abs. 1 KI-VO i. d. F. der VO (EU) 2026/1744.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

    - id: G-05
      gegenstand: "Beruecksichtigung bei der Bemessung von Sanktionen"
      fundstelle: "Art. 99 Abs. 1 KI-VO"
      gilt_fuer_groesse:
        original: [kmu]
        omnibus: [kmu, kleines_midcap]
      lesart_original: >-
        Bei der Festsetzung von Sanktionen beruecksichtigen die Mitgliedstaaten
        die Interessen von KMU einschliesslich Start-ups sowie deren
        wirtschaftliches Ueberleben. Die Vorschrift richtet sich an die Behoerde,
        wirkt aber zugunsten des Unternehmens.
      lesart_omnibus: >-
        Art. 1 Nr. 38 lit. a der VO (EU) 2026/1744 fasst Art. 99 Abs. 1 neu und
        ergaenzt die kleinen Midcap-Unternehmen: beruecksichtigt werden die
        Interessen von KMU einschliesslich Start-ups und von kleinen Midcaps
        sowie deren wirtschaftliches Ueberleben. Fundstelle i. d. F.: Art. 99
        Abs. 1 KI-VO i. d. F. der VO (EU) 2026/1744.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

    - id: G-06
      gegenstand: "Gedeckelte Geldbusse (KMU)"
      fundstelle: "Art. 99 Abs. 6 KI-VO"
      gilt_fuer_groesse: [kmu]
      verweist_auf: Q-02
      verweist_auf_feld: kmu_regel
      hinweis: >-
        Zeiger auf Q-02, kein eigener Regeltext. Die KMU-Deckelung nach Abs. 6
        besteht bereits im Ausgangsrecht und gilt in beiden Lesarten.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

    - id: G-07
      gegenstand: "Gedeckelte Geldbusse (kleine Midcaps)"
      fundstelle: "Art. 99 Abs. 6a KI-VO i. d. F. der VO (EU) 2026/1744"
      gilt_fuer_groesse: [kleines_midcap]
      gilt_in_lesart: [omnibus]
      verweist_auf: Q-02
      verweist_auf_feld: midcap_regel
      hinweis: >-
        Zeiger auf Q-02.midcap_regel, kein eigener Regeltext. Abs. 6a wird durch
        Art. 1 Nr. 38 lit. c der VO (EU) 2026/1744 eingefuegt und gilt daher nur
        in der Lesart omnibus (gilt_in_lesart). Der engere Umfang gegenueber der
        KMU-Deckelung, nur Abs. 4 und Abs. 5, nicht Abs. 3, steht im Zielfeld.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

    - id: G-08
      gegenstand: "Vorrangiger Zugang zum KI-Reallabor des KI-Bueros auf Unionsebene"
      fundstelle: "Art. 57 Abs. 3a KI-VO i. d. F. der VO (EU) 2026/1744"
      gilt_fuer_groesse: [kmu, kleines_midcap]
      gilt_in_lesart: [omnibus]
      text: >-
        Das KI-Buero kann auf Unionsebene ein KI-Reallabor fuer KI-Systeme
        einrichten, die unter Art. 75 Abs. 1 fallen, und gewaehrt KMU
        einschliesslich Start-ups sowie kleinen Midcaps vorrangigen Zugang dazu.
        Omnibus-neu durch Art. 1 Nr. 22 lit. c. Enger als G-03: betrifft nur das
        Unions-Reallabor des KI-Bueros, nicht die nationalen Reallabore. Fuer die
        Zielgruppe dieses Werkzeugs meist von geringem praktischem Gewicht.
      hinweis: >-
        Der ebenfalls durch Art. 1 Nr. 22 lit. e um kleine Midcaps ergaenzte
        Zielsatz in Art. 57 Abs. 9 lit. e bleibt ein Programmsatz ohne
        Anspruchscharakter und ist deshalb hier nicht als Erleichterung gefuehrt.
      geprueft: true
      geprueft_am: "2026-07-30"
      geprueft_von: "Niklas Steinhauser"

