lesarten:
  omnibus:
    bezeichnung: "Fassung nach Digital-Omnibus-Verordnung zur KI"
    rechtsakt: "Verordnung (EU) 2026/1744"
    celex: "32026R1744"
    verfahren: "2025/0359(COD)"
    kommissionsvorschlag: "COM(2025) 836 final vom 2025-11-19"
    trilog_einigung: "2026-05-07"
    ep_erste_lesung: "2026-06-16"
    rat_annahme: "2026-06-29"
    unterzeichnet: "2026-07-08"
    amtsblatt: "ABl. L, 2026/1744, 24.7.2026"
    eli: "http://data.europa.eu/eli/reg/2026/1744/oj"
    inkrafttreten: "2026-07-27"
    status: "in Kraft"
    eingearbeitet: false
    geprueft: false
    hinweis: >-
      Der Aenderungsrechtsakt liegt im Amtsblatt vor und ist in Kraft. Seine
      Auswirkungen sind in dieses Regelwerk noch NICHT eingearbeitet. Betroffen
      sind mindestens: Art. 5 (zwei neue Verbotstatbestaende lit. ba und bb),
      Art. 113 Abs. 3 (Fristen Kapitel III), Art. 3 Nr. 14 und Art. 6 Abs. 1a
      bis 1c (Begriff Sicherheitsbauteil), Art. 4 (KI-Kompetenz), Art. 111
      Abs. 2 und 4 (Bestandsschutz, Uebergangsfrist Art. 50 Abs. 2) sowie
      Anhang I (Maschinenverordnung von Abschnitt A nach Abschnitt B). Wer
      diese Lesart nutzen will, muss sie zuvor gegen den Text pruefen.
    # PHASE-11-VERMERK: Sobald eingearbeitet auf true geht, ist zu entscheiden,
    # ob beispiel.py auf die Lesart omnibus umgestellt wird. Solange die Sperre
    # steht, rechnet die Demo bewusst in original (kein Vorgriff auf einen als
    # unvollstaendig ausgewiesenen Stand). Sichtbar bleiben unter original
    # dennoch Abschnitt B (lesartunabhaengig) und fuenf der sieben
    # Erleichterungen (G-01, G-03, G-04, G-05, G-06); nur G-07 und G-08 fehlen,
    # was der Omnibus-Vorbehalt im Dossier erklaert.

  original:
    bezeichnung: "Originalfassung"
    rechtsakt: "Verordnung (EU) 2024/1689"
    celex: "32024R1689"
    inkrafttreten: "2024-08-01"
    geltungsbeginn_allgemein: "2026-08-02"
    status: "in Kraft"
    geprueft: false
