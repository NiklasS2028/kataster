# -----------------------------------------------------------------------------
# BESTANDSSCHUTZ
# -----------------------------------------------------------------------------
# Praktisch der wichtigste Filter fuer Bestandssysteme im Mittelstand.
# -----------------------------------------------------------------------------

bestandsschutz:
  - id: B-01
    gegenstand: "Hochrisiko-KI-Systeme, die vor dem allgemeinen Geltungsbeginn in Verkehr gebracht oder in Betrieb genommen wurden"
    regel: >-
      Die Verordnung gilt fuer solche Systeme nur dann, wenn sie nach dem
      Geltungsbeginn des Kapitels III in ihrer Konzeption erheblich veraendert
      wurden. Der Stichtag ist nicht fest, sondern richtet sich nach
      Art. 113: 2. Dezember 2027 fuer Systeme nach Anhang III (F-05),
      2. August 2028 fuer Systeme nach Anhang I (F-06).
    frage: "Wurde das System vor dem fuer seine Klasse geltenden Stichtag in Betrieb genommen?"
    folgefrage: "Wurde es seitdem in seiner Konzeption erheblich veraendert?"
    fundstelle: "Art. 111 Abs. 2 KI-VO"
    ausnahme: >-
      Fuer Hochrisiko-Systeme, die bestimmungsgemaess von Behoerden verwendet
      werden, gilt die Frist 2. August 2030 - unabhaengig von Veraenderungen.
    hinweis: >-
      Erhebliche Veraenderung ist hier gleichbedeutend mit der wesentlichen
      Veraenderung nach Art. 3 Nr. 23. Nach Erwaegungsgrund 39 der Verordnung
      (EU) 2026/1744 genuegt es, dass eine einzelne Einheit derselben Art und
      desselben Modells vor dem Stichtag rechtmaessig in Verkehr gebracht
      wurde; weitere Einheiten geniessen dann dieselbe Uebergangsfrist,
      solange die Gestaltung unveraendert bleibt.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: B-02
    gegenstand: "KI-Modelle mit allgemeinem Verwendungszweck, die vor dem 2. August 2025 in Verkehr gebracht wurden"
    regel: "Erfuellung der Pflichten bis zum 2. August 2027."
    fundstelle: "Art. 111 Abs. 3 KI-VO"
    geprueft: false

# -----------------------------------------------------------------------------
# ROLLENBESTIMMUNG
# -----------------------------------------------------------------------------
# Angeglichen an Art. 3 Nr. 3 und 4 sowie Art. 25 Abs. 1.
# -----------------------------------------------------------------------------

rollenbestimmung:
  fundstelle: "Art. 3 Nr. 3 und Nr. 4, Art. 25 Abs. 1 KI-VO"
  geprueft: false
  fragen:
    - id: R-01
      text: >-
        Verwenden Sie das System in eigener Verantwortung im Rahmen einer
        beruflichen Taetigkeit?
      wenn_ja: "betreiber"
      fundstelle: "Art. 3 Nr. 4 KI-VO"

    - id: R-02
      text: >-
        Versehen Sie ein bereits in Verkehr gebrachtes System mit Ihrem eigenen
        Namen oder Ihrer eigenen Handelsmarke?
      wenn_ja: "anbieter"
      fundstelle: "Art. 25 Abs. 1 lit. a KI-VO"
      hinweis: >-
        Greift unbeschadet vertraglicher Vereinbarungen, die eine andere
        Aufteilung der Pflichten vorsehen.

    - id: R-03
      text: >-
        Nehmen Sie an einem bereits in Verkehr gebrachten Hochrisiko-System eine
        wesentliche Veraenderung vor, sodass es weiterhin Hochrisiko bleibt?
      wenn_ja: "anbieter"
      fundstelle: "Art. 25 Abs. 1 lit. b KI-VO"

    - id: R-04
      text: >-
        Veraendern Sie die Zweckbestimmung eines nicht als Hochrisiko
        eingestuften Systems so, dass es dadurch zu einem Hochrisiko-System wird?
      wenn_ja: "anbieter"
      fundstelle: "Art. 25 Abs. 1 lit. c KI-VO"

    - id: R-05
      text: >-
        Bringen Sie das System zusammen mit einem eigenen Produkt unter Ihrem
        Namen in Verkehr oder nehmen es unter Ihrem Namen in Betrieb?
      wenn_ja: "anbieter"
      fundstelle: "Art. 25 Abs. 3 KI-VO"

  rollen:
    betreiber:
      bezeichnung: "Betreiber (Deployer)"
      typisch_fuer: "Unternehmen, das ChatGPT, Copilot o. ae. im Alltag nutzt"
      pflichtenverweis: "Art. 26 KI-VO (nur bei Hochrisiko-Systemen)"
    anbieter:
      bezeichnung: "Anbieter (Provider)"
      hinweis: >-
        Deutlich weitergehende Pflichten. Der urspruengliche Anbieter gilt dann
        nicht mehr als Anbieter dieses Systems (Art. 25 Abs. 2).
      pflichtenverweis: "Art. 16 KI-VO (bei Hochrisiko-Systemen)"

