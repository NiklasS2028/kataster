# ---------------------------------------------------------------------------
# Anhang I: Harmonisierungsrechtsvorschriften der Union
#
# Die Unterscheidung zwischen Abschnitt A und B entscheidet nicht ueber die
# Einstufung - beide fuehren nach Art. 6 Abs. 1 zu hochrisiko -, sondern ueber
# das anwendbare Pflichtenregime (Art. 2 Abs. 2).
# ---------------------------------------------------------------------------

anhang_i:
  herkunft: >-
    Liste der Rechtsakte uebernommen aus dem AI-Act-Explorer des Future of Life
    Institute (artificialintelligenceact.eu, Abruf 28.07.2026), dort als
    maschinelle Uebersetzung gekennzeichnet. Massgeblich ist der amtliche Text
    der KI-VO. Die Nummerierung wird durch Anhang XIV der KI-VO in der Fassung
    der VO (EU) 2026/1744 gestuetzt: die AIP-Codes laufen von 0102 bis 0112 und
    entsprechen Abschnitt A Nr. 2 bis 12.
  geprueft: false

  abschnitt_a:
    bezeichnung: "Harmonisierungsrechtsvorschriften auf Grundlage des neuen Rechtsrahmens"
    rechtsfolge: >-
      Kapitel III gilt vollstaendig. Konformitaetsbewertung nach Art. 43
      Abs. 3 im Verfahren der jeweiligen Harmonisierungsrechtsvorschrift.
    rechtsakte:
      - nr: 2
        titel: "Richtlinie 2009/48/EG (Sicherheit von Spielzeug)"
      - nr: 3
        titel: "Richtlinie 2013/53/EU (Sportboote und Wassermotorraeder)"
      - nr: 4
        titel: "Richtlinie 2014/33/EU (Aufzuege und Sicherheitsbauteile fuer Aufzuege)"
      - nr: 5
        titel: "Richtlinie 2014/34/EU (Geraete in explosionsgefaehrdeten Bereichen)"
      - nr: 6
        titel: "Richtlinie 2014/53/EU (Funkanlagen)"
      - nr: 7
        titel: "Richtlinie 2014/68/EU (Druckgeraete)"
      - nr: 8
        titel: "Verordnung (EU) 2016/424 (Seilbahnen)"
      - nr: 9
        titel: "Verordnung (EU) 2016/425 (Persoenliche Schutzausruestung)"
      - nr: 10
        titel: "Verordnung (EU) 2016/426 (Gasverbrauchseinrichtungen)"
      - nr: 11
        titel: "Verordnung (EU) 2017/745 (Medizinprodukte)"
      - nr: 12
        titel: "Verordnung (EU) 2017/746 (In-vitro-Diagnostika)"
    entfallen:
      - nr: 1
        titel: "Richtlinie 2006/42/EG (Maschinen)"
        hinweis: >-
          Gestrichen durch Art. 1 Nr. 41 lit. a der VO (EU) 2026/1744. Die
          Nachfolgeverordnung (EU) 2023/1230 steht seitdem in Abschnitt B
          Nr. 21. Es wird nicht neu durchnummeriert.

  abschnitt_b:
    bezeichnung: "Andere Harmonisierungsrechtsvorschriften der Union"
    rechtsfolge: >-
      Nach Art. 2 Abs. 2 gelten nur Art. 6 Abs. 1, Art. 60a und Art. 102 bis
      112. Kapitel III gilt nicht unmittelbar. Art. 57, 58 und 59 gelten nur,
      soweit die Anforderungen an Hochrisiko-KI-Systeme im Rahmen der
      jeweiligen Harmonisierungsrechtsvorschrift uebernommen wurden.
    fundstelle: "Art. 2 Abs. 2 KI-VO i. d. F. des Art. 1 Nr. 2 lit. a VO (EU) 2026/1744"
    rechtsakte:
      - nr: 13
        titel: "Verordnung (EG) Nr. 300/2008 (Sicherheit in der Zivilluftfahrt)"
      - nr: 14
        titel: "Verordnung (EU) Nr. 168/2013 (zwei-, drei- und vierraedrige Fahrzeuge)"
      - nr: 15
        titel: "Verordnung (EU) Nr. 167/2013 (land- und forstwirtschaftliche Fahrzeuge)"
      - nr: 16
        titel: "Richtlinie 2014/90/EU (Schiffsausruestung)"
      - nr: 17
        titel: "Richtlinie (EU) 2016/797 (Interoperabilitaet des Eisenbahnsystems)"
      - nr: 18
        titel: "Verordnung (EU) 2018/858 (Kraftfahrzeuge und Kraftfahrzeuganhaenger)"
      - nr: 19
        titel: "Verordnung (EU) 2019/2144 (allgemeine Sicherheit von Kraftfahrzeugen)"
      - nr: 20
        titel: "Verordnung (EU) 2018/1139 (Zivilluftfahrt)"
        hinweis: >-
          Nur soweit Konstruktion, Herstellung und Inverkehrbringen unbemannter
          Luftfahrzeuge samt Triebwerken, Propellern, Teilen und Ausruestung zur
          Fernsteuerung betroffen sind.
      - nr: 21
        titel: "Verordnung (EU) 2023/1230 (Maschinen)"
        neu_durch: "Art. 1 Nr. 41 lit. b VO (EU) 2026/1744"
        hinweis: >-
          Grundlegende Sicherheits- und Gesundheitsschutzanforderungen fuer
          KI-Sicherheitsbauteile in Maschinen werden ueber delegierte
          Rechtsakte zu Anhang III der VO (EU) 2023/1230 nachgezogen und gelten
          ab dem 2. August 2028 (Art. 3 Nr. 1 VO (EU) 2026/1744).

