# =============================================================================
# KATASTER - Regelwerk EU-KI-Verordnung
# =============================================================================
# Dieses Regelwerk ist die einzige Stelle, an der Rechtsinhalte stehen.
# Der Anwendungscode kennt keine Paragraphen - er wertet nur diese Datei aus.
#
# ZUM FELD "geprueft":
# Alle Eintraege wurden gegen den amtlichen Text der Verordnung (EU) 2024/1689
# abgeglichen (Feld "abgeglichen_am"). Das Feld "geprueft" setzt derjenige auf
# true, der den Wortlaut selbst am amtlichen Text nachgelesen hat - mit Datum
# und Namen. Solange dort false steht, darf die Regel nicht ausgeliefert werden.
# =============================================================================

meta:
  regelwerk_version: "1.0.1"
  rechtsstand: "2026-07-23"
  abgeglichen_am: "2026-07-27"
  abgeglichen_gegen: >-
    Verordnung (EU) 2024/1689, amtlicher deutscher Text, CELEX 32024R1689,
    Fassung vor Verordnung (EU) 2026/1744
  sprache: "de"
  autor: "Niklas Steinhauser"
  lizenz_regelwerk: "CC-BY-4.0"
  hinweis: >-
    Dieses Regelwerk ist eine Recherchehilfe zur strukturierten
    Selbsteinschaetzung und Dokumentation. Es ist KEINE Rechtsberatung.
    Authentisch sind ausschliesslich die im Amtsblatt der Europaeischen Union
    veroeffentlichten Texte (Art. 297 AEUV).
  aenderungshistorie:
    - datum: "2026-07-28"
      version: "1.0.1"
      aenderung: >-
        Korrektur des Rechtsstands. Die Angabe in Version 1.0.0, der
        Aenderungsrechtsakt habe zum Rechtsstand nicht im Amtsblatt
        vorgelegen, ist unzutreffend. Die Digital-Omnibus-Verordnung zur KI,
        Verordnung (EU) 2026/1744, wurde am 24.07.2026 im Amtsblatt
        veroeffentlicht (ABl. L, 2026/1744, CELEX 32026R1744) und trat am
        27.07.2026 in Kraft, also am Tag des angegebenen Rechtsstands. Der
        Rechtsstand wird daher auf den 23.07.2026 zurueckgesetzt, den letzten
        Tag, an dem der Inhalt dieser Datei die Rechtslage vollstaendig
        abbildete; die Datei wurde entsprechend umbenannt. Regelinhalte
        unveraendert. Die Einarbeitung des Aenderungsrechtsakts steht aus,
        siehe lesarten.omnibus.
    - datum: "2026-07-28"
      version: "1.0.0"
      aenderung: >-
        Freigabe. Alle 25 Regeln sind gegen den amtlichen Text der
        Verordnung (EU) 2024/1689 verifiziert, geprueft von Niklas Steinhauser. Der
        Entwurfszusatz entfaellt. Offen bleibt allein die Omnibus-Lesart:
        Der Aenderungsrechtsakt lag zum Rechtsstand nicht im Amtsblatt
        vor, das Feld lesarten.omnibus.amtsblatt ist weiterhin null. Wer
        diese Lesart nutzt, muss sie zuvor gegen den veroeffentlichten
        Text pruefen.
    - datum: "2026-07-27"
      version: "0.1.0-entwurf"
      aenderung: "Ersterstellung. Fundstellen durchgaengig ungeprueft."
    - datum: "2026-07-27"
      version: "0.2.0-entwurf"
      aenderung: >-
        Abgleich gegen den amtlichen Text. Alle 14 Fundstellen der Erstfassung
        bestaetigt. Korrigiert: V-01 (Bildungseinrichtungen ergaenzt), V-02
        (sexuelle Ausrichtung und Ausnahme ergaenzt), H-06 (Waerme und kritische
        digitale Infrastruktur ergaenzt), T-01 (als Anbieterpflicht praezisiert),
        R-02/R-03 (an Art. 25 Abs. 1 angeglichen). Neu: Anhang-I-Pfad nach
        Art. 6 Abs. 1, Anhang III Nr. 1, Nr. 5 lit. a und d, Nr. 8 lit. a,
        Ausnahmefilter nach Art. 6 Abs. 3, Bestandsschutz nach Art. 111,
        Anwendungsbereichsausnahmen, Betreiberpflichten nach Art. 26,
        Grundrechte-Folgenabschaetzung nach Art. 27.
    - datum: "2026-07-27"
      version: "0.3.0-entwurf"
      aenderung: >-
        Abschnitt einsatzkontexte ergaenzt: elf Kontexte und die Zuordnung der
        24 Regeln dazu. Keine inhaltliche Aenderung an Regeln, Fundstellen oder
        Einstufungslogik - der Vorfilter steuert ausschliesslich, welche Fragen
        gestellt werden. Der gewaehlte Kontext ist im Nachweis-Dossier
        auszuweisen, damit nachvollziehbar bleibt, warum eine Regel nicht
        geprueft wurde.
    - datum: "2026-07-28"
      version: "0.3.1-entwurf"
      aenderung: >-
        Verifikation Art. 5 durch N. Steinhauser: Buchstabenzuordnung f, g, c,
        e, a, b bestaetigt. Korrigiert: V-01 Ausnahmewortlaut ("auf den Markt
        gebracht"), V-02 Tatbestandsmerkmal "individuell" und
        "erschliessen oder ableiten" ergaenzt, V-05 und V-06 um den drohenden
        Schaden ergaenzt ("oder mit hinreichender Wahrscheinlichkeit"). Die
        Nichtabbildung von Art. 5 Abs. 1 lit. d und h ist als bewusste
        Entscheidung dokumentiert.
    - datum: "2026-07-28"
      version: "0.4.0-entwurf"
      aenderung: >-
        Verifikation Anhang III, Art. 50 und Art. 6 durch N. Steinhauser. Alle
        18 Fundstellen bestaetigt. Inhaltlich korrigiert: H-12 war zu weit -
        die Eingrenzung "von einer oder im Namen einer Justizbehoerde" fehlte;
        H-02 war zu eng - der Normtext erfasst Entscheidungen, die die
        Arbeitsbedingungen BEEINFLUSSEN, nicht nur solche darueber. Neu
        aufgenommen: H-13 (Anhang III Nr. 8 lit. b, Beeinflussung von Wahlen
        und Referenden) - anders als Nr. 6 und 7 nicht auf Behoerden
        beschraenkt und damit fuer die Zielgruppe einschlaegig. Praezisiert:
        H-05, H-07, H-08, H-09, H-10, T-02. Anmerkungen ergaenzt, wo die
        Pruefrage bewusst vom Wortlaut abweicht.
    - datum: "2026-07-28"
      version: "0.4.1-entwurf"
      aenderung: >-
        Nachpruefung V-05 und V-06 durch N. Steinhauser. V-05 war zu weit
        gefasst: Es fehlten das Merkmal "absichtlich" sowie das Zwischenglied,
        dass die Verhaltensaenderung durch Beeintraechtigung der freien
        Entscheidung eintritt. Ohne diese Merkmale waeren uebliche
        Werbewerkzeuge als verbotene Praktik eingestuft worden. V-06 auf
        "mit dem Ziel oder der Wirkung" umgestellt - die blosse Wirkung genuegt,
        eine Absicht ist nicht erforderlich.

