# -----------------------------------------------------------------------------
# EINSATZKONTEXTE - Vorfilter
# -----------------------------------------------------------------------------
# Eine Mehrfachauswahl zu Beginn der Erfassung blendet Regelgruppen aus, die
# fuer das jeweilige System nicht einschlaegig sein koennen. Ein Textassistent
# im Marketing bekommt so keine Fragen zu Kreditwuerdigkeit oder Notruf-Triage.
#
# WICHTIG fuer die Nachweisqualitaet: Eine ausgeblendete Frage ist keine
# unbeantwortete Frage. Im Dossier wird der gewaehlte Einsatzkontext
# ausgewiesen, und daraus ergibt sich nachvollziehbar, warum eine Regel nicht
# geprueft wurde. Wer den Kontext falsch angibt, bekommt eine falsche
# Einstufung - deshalb ist die Auswahl im Dossier sichtbar zu dokumentieren.
#
# Regeln ohne Zuordnung werden IMMER gestellt.
# -----------------------------------------------------------------------------

einsatzkontexte:
  hinweis: >-
    Mehrfachauswahl. Im Zweifel lieber einen Kontext zu viel als zu wenig
    auswaehlen - die Auswahl steuert nur, welche Fragen gestellt werden, nicht
    das Ergebnis.

  definitionen:
    - id: interne_verwaltung
      label: "Interne Verwaltung und Buero"
      beschreibung: >-
        Dokumente, Recherche, Uebersetzungen, Protokolle, interne Ablaeufe ohne
        Bezug zu Personalentscheidungen.
    - id: personal
      label: "Personal und Beschaeftigte"
      beschreibung: >-
        Bewerbung, Auswahl, Beurteilung, Aufgabenzuweisung, Ueberwachung von
        Leistung oder Verhalten.
    - id: kundenkontakt
      label: "Direkter Kontakt mit Kunden oder Oeffentlichkeit"
      beschreibung: "Chatbots, Beratung, Service, Ansprache von Interessenten."
    - id: inhalte
      label: "Erzeugen oder Bearbeiten von Inhalten"
      beschreibung: "Texte, Bilder, Audio, Video - auch zur Veroeffentlichung."
    - id: biometrie
      label: "Koerperbezogene Daten"
      beschreibung: >-
        Gesicht, Stimme, Fingerabdruck, Gangbild, Emotionen - egal ob zur
        Erkennung, Zuordnung oder Auswertung.
    - id: produkt
      label: "Bestandteil eines Produkts oder einer Maschine"
      beschreibung: >-
        Das System steckt in einem Erzeugnis, das Sie herstellen oder in
        Verkehr bringen.
    - id: finanzen_versicherung
      label: "Bonitaet, Kredit oder Versicherung"
      beschreibung: "Kreditwuerdigkeit, Risikobewertung, Preisbildung."
    - id: bildung
