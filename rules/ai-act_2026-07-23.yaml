    frage: >-
      Wird das System ausschliesslich im Rahmen einer persoenlichen, nicht
      beruflichen Taetigkeit verwendet?
    folge: "ausserhalb des Anwendungsbereichs"
    fundstelle: "Art. 2 Abs. 10 KI-VO"
    geprueft: false

  - id: A-02
    frage: >-
      Wird das System eigens und ausschliesslich fuer wissenschaftliche
      Forschung und Entwicklung entwickelt und betrieben?
    folge: "ausserhalb des Anwendungsbereichs"
    fundstelle: "Art. 2 Abs. 6 KI-VO"
    geprueft: false

  - id: A-03
    frage: >-
      Handelt es sich um Forschungs-, Test- oder Entwicklungstaetigkeit vor
      dem Inverkehrbringen oder der Inbetriebnahme?
    folge: "ausserhalb des Anwendungsbereichs"
    hinweis: "Tests unter Realbedingungen sind von dieser Ausnahme ausgenommen."
    fundstelle: "Art. 2 Abs. 8 KI-VO"
    geprueft: false

  - id: A-04
    frage: >-
      Wird das System unter einer freien und quelloffenen Lizenz bereitgestellt?
    folge: "ausserhalb des Anwendungsbereichs, ABER nur wenn es weder Hochrisiko
      ist noch unter Art. 5 oder Art. 50 faellt"
    fundstelle: "Art. 2 Abs. 12 KI-VO"
    bedingt: true
    geprueft: false

