      Das System ist so zu konzipieren, dass die betroffene Person darueber
      informiert wird, dass sie mit einem KI-System interagiert.
    ausnahmen: >-
      Entfaellt, wenn dies aus Sicht einer angemessen informierten, aufmerksamen
      und verstaendigen Person aufgrund der Umstaende offensichtlich ist.
    frist_ref: F-04
    hinweis: >-
      ANBIETERPFLICHT. Ein reiner Betreiber eines zugekauften Chatbots ist nicht
      Adressat. Er kann aber ueber R-02 zum Anbieter werden.
    geprueft: true
    geprueft_am: "2026-07-28"
    geprueft_von: "Niklas Steinhauser"

  - id: T-05
    frage: >-
      Erzeugt das System synthetische Audio-, Bild-, Video- oder Textinhalte?
    trifft_zu_wenn: synthetische_inhalte
    nur_bei_rolle: [anbieter]
    klasse: transparenz
    fundstelle: "Art. 50 Abs. 2 KI-VO"
